name: Build Blockit APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Blockit Android project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Blockit ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          PROJECT=$(find extracted -type f -name "settings.gradle" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Android project found at: $PROJECT"

          echo "$PROJECT" > android_project_path.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          cache-provider: basic

      - name: Build Blockit APK
        shell: bash
        run: |
          set -e

          PROJECT=$(cat android_project_path.txt)

          echo "Building project: $PROJECT"

          cd "$PROJECT"

          gradle --no-daemon assembleDebug

      - name: Upload Blockit APK
        uses: actions/upload-artifact@v4
        with:
          name: Blockit-Android-v1.5.0-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
